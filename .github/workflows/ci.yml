# CI — lint + unit/API tests on every push and pull request
name: CI

on:
  push:
    branches: [main, dev, "dev_*"]
  pull_request:
    branches: [main, dev]

jobs:
  test:
    name: Ruff + Pytest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff (lint)
        run: ruff check app tests

      - name: Pytest (unit + API smoke; skip opt-in Postgres/E2E)
        run: pytest -q -m "not e2e"
        env:
          # Ensure integration Postgres smoke stays skipped in CI.
          RUN_INTEGRATION: "0"
          RUN_E2E: "0"
